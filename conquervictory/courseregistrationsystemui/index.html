<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Registration System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      margin-top: 70px;
    }
    h2 {
      color: blue;
    }
    button {
      background-color: #595d5e;
      color: white;
      padding: 20px 20px;
      border-radius: 5px;
    }
    button:hover {
      background-color: #2f3031;
    }
  </style>
</head>
<body>
  <h2>Course Registration System</h2>

  <a href="register.html"><button id="registerBtn">Register a course</button></a>
  <a href="availCourses.html"><button id="availableBtn" style="display: none;">Available Courses</button></a>
  <a href="enrolled.html"><button id="enrolledBtn" style="display: none;">Enrolled Students</button></a>

  <script>
    const authHeader = localStorage.getItem('authHeader');

    if (!authHeader) {
      window.location.href = 'login.html'; // Not logged in
    }

    fetch("http://localhost:8080/userinfo", {
      method: 'GET',
      headers: {
        "Authorization": authHeader
      }
    })
    .then(response => {
      if (!response.ok) {
        throw new Error("Not authenticated");
      }
      return response.json();
    })
    .then(data => {
      const roles = data.roles || [];

      if (roles.includes("ROLE_ADMIN")) {
        document.getElementById("availableBtn").style.display = "inline-block";
        document.getElementById("enrolledBtn").style.display = "inline-block";
      }
      // ROLE_USER sees only Register button by default
    })
    .catch(error => {
      console.error("User not authenticated:", error);
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
