<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register a course</title>

    <style>
            body {
                background-color: black;
                text-align: center; 
            }

            form {
                margin:  auto;
                padding: 20px;
                width: 400px; 
                background-color: #fff;
            }

            input, select, button {
                width: 90%;
                padding: 10px;
                margin: 10px;
            }

            button {
                background-color: #4CAF50;
                color: white; 
                font-weight: bold;
                font-size: medium;
                cursor: pointer; 
            }

            button:hover {
                background-color: #104212; 
            }
        
    </style>
</head>
<body>
    <h1 style="color: yellow;">Kickstart with an exciting course</h1>
    <form action="http://localhost:8080/courses/register" method="post">
        <label for="name"> Enter Your name</label><br>
        <input type="text" name="name"><br><br>

        <label for="email"> Enter Your EmailId</label><br>
        <input type="email" name="emailId"><br><br>

        <label for="course">Choose a course</label><br>
        <select name="courseName" id="course">
            <option value="" disabled selected>select course</option>
            <option value="Java Essentials">Java Essentials</option>
            <option value="Python For ML">Python For ML</option>
            <option value="Springboot">Springboot</option>
        </select>
        <br><br>

        <button type="submit">Submit</button>

    </form>
</body>
</html>
